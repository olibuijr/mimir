name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Build the web UI
        run: cd web && npm ci --no-audit --no-fund && npm run build
      - name: Prepare Rust
        run: rustup toolchain install stable --profile minimal --component clippy && rustup default stable
      - name: Test
        run: cargo test --locked
      - name: Warnings
        run: cargo clippy --locked --all-targets
      - name: Shell syntax
        run: bash -n release.sh deploy/install.sh deploy/client.sh
